<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hello World! · Jungle</title>
<style>
  /* HALO-93: the approved HALO-92 jungle page, adapted from its review frames
     to a real browser window. Everything is inline: no other request is made.
     Sizes are in vw so the layout scales with the window width, as the design
     scales with its frame. The stage reserves the decorations' footprint as
     padding, so on a short window the page grows instead of overlapping. */
  *, *::before, *::after { box-sizing: border-box; }
  html { background: #0F3D2E; }
  html, body { margin: 0; padding: 0; }
  body {
    position: relative;
    overflow-x: hidden;
    min-height: 100vh;
    min-height: 100dvh;
    background: radial-gradient(ellipse 60% 55% at 50% 50%, #155239 0%, #0F3D2E 100%);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .deco { position: absolute; z-index: 1; pointer-events: none; display: block; }

  /* Desktop (reference 1440): heading 9vw on one line; corners 21vw; vines
     4vw at a 1.5vw inset; bushes 13vw; 16vw side and 12vw bottom clearance.
     The heading sits where the design centres it, (height - 12vw) / 2, but
     never closer than 14vw to the top, clear of the corner leaves. */
  .stage {
    position: relative;
    z-index: 2;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    min-height: 100vh;
    min-height: 100dvh;
    padding: max(14vw, calc((100vh - 12vw - 9.45vw) / 2)) 16vw 12vw;
    padding-top: max(14vw, calc((100dvh - 12vw - 9.45vw) / 2));
  }
  h1 {
    margin: 0;
    color: #F2C230;
    font-family: inherit;
    font-size: 9vw;
    font-weight: 800;
    line-height: 1.05;
    letter-spacing: -0.01em;
    text-align: center;
    white-space: nowrap;
  }
  .deco-tl { top: 0; left: 0; width: 21vw; height: 21vw; }
  .deco-tr { top: 0; right: 0; width: 21vw; height: 21vw; transform: scaleX(-1); }
  .deco-vl { top: 14vw; left: 1.5vw; width: 4vw; height: calc(100% - 28vw); }
  .deco-vr { top: 14vw; right: 1.5vw; width: 4vw; height: calc(100% - 28vw); transform: scaleX(-1); }
  .deco-bush { left: 0; right: 0; bottom: 0; width: 100%; height: 13vw; }

  /* Mobile (reference 375): heading 19vw on two lines, "Hello" / "World!";
     corners 34vw; bushes 24vw; side vines hidden; 16px side padding. The
     heading is centred above the bushes but kept below the corner leaves. */
  @media (max-width: 40em) {
    .stage {
      padding: max(34vw, calc((100vh - 22vw - 39.9vw) / 2)) 16px 22vw;
      padding-top: max(34vw, calc((100dvh - 22vw - 39.9vw) / 2));
    }
    h1 { font-size: 19vw; white-space: normal; }
    h1 span { display: block; }
    .deco-tl, .deco-tr { width: 34vw; height: 34vw; }
    .deco-vl, .deco-vr { display: none; }
    .deco-bush { height: 24vw; }
  }
</style>
</head>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found</title>
<link rel="stylesheet" href="tokens.css">
<style>
  /* Concept A · Quiet: the Home page's own skeleton, one more sentence and a link. */
  main { padding: var(--pad); max-width: 36rem; margin: 0 auto; text-align: center; }
  .mark { margin: 2rem 0 0; font-size: 1rem; font-weight: 600; letter-spacing: .3em; color: var(--muted); }
  h1 { margin: .5rem 0 1rem; }
  p.explain { margin: 0 0 1.5rem; line-height: 1.5; }
  a.home { display: inline-block; padding: .75rem .25rem; font-size: 1.0625rem; }
</style>
</head>
<body>
<main>
  <p class="mark" aria-hidden="true">404</p>
  <h1>Page not found</h1>
  <p class="explain">The link you followed may be broken, or the page may have moved.</p>
  <a class="home" href="home.html">Go to the home page</a>
</main>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found</title>
<link rel="stylesheet" href="tokens.css">
<style>
  /* SCRUM-123 · Page not found · default · Phone layout. Concept A (Quiet). */
  *, *::before, *::after { box-sizing: border-box; }
  main { padding: var(--pad); text-align: center; }
  .mark { margin: 1.5rem 0 0; }
  h1 { margin: .5rem 0 .75rem; font-size: 1.75rem; }
  p.explain { margin: 0 0 1.25rem; line-height: var(--body-line); }
  a.home { display: inline-flex; align-items: center; justify-content: center; min-height: var(--tap); padding: .75rem 1rem; font-size: 1.0625rem; }
</style>
</head>
<body>
<main>
  <p class="mark" aria-hidden="true">404</p>
  <h1>Page not found</h1>
  <p class="explain">The link you followed may be broken, or the page may have moved.</p>
  <a class="home" href="home.default.mobile.html">Go to the home page</a>
</main>
</body>
</html>

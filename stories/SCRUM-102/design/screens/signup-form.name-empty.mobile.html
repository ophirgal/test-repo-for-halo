<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Signup form</title><link rel="stylesheet" href="tokens.css"></head>
<body class="mobile">
<main class="split-page">
<div class="split">
<section class="context">
<a class="link-back" href="welcome.default.mobile.html">← Back</a>
<ol class="vsteps" aria-label="Progress, step 2 of 3"><li class="done"><span class="dot" aria-hidden="true">✓</span><span class="label">1. Welcome</span></li><li class="current" aria-current="step"><span class="dot" aria-hidden="true">2</span><span class="label">2. Your details</span></li><li><span class="dot" aria-hidden="true">3</span><span class="label">3. Done</span></li></ol>
<h1>Subscribe to the newsletter</h1>
<p class="muted">News and updates from the site, sent to your inbox.</p>
</section>
<section class="action" aria-label="Your details">
<form action="confirmation.default.mobile.html" method="get" novalidate>
<div class="field has-error">
<label for="name">Name</label>
<input class="input is-focused" id="name" name="name" type="text" autocomplete="name" maxlength="80" required value="" aria-describedby="name-error name-hint" aria-invalid="true" autofocus>
<div class="error-msg" id="name-error"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="7.5" fill="#b3261e"/><path d="M8 4v5" stroke="#fff" stroke-width="2" stroke-linecap="round"/><circle cx="8" cy="11.8" r="1.1" fill="#fff"/></svg><span><span class="sr-only">Error: </span>Enter your name.</span></div><div class="hint" id="name-hint">Up to 80 characters.</div>
</div>
<div class="field">
<label for="email">Email address</label>
<input class="input" id="email" name="email" type="email" autocomplete="email" inputmode="email" required value="maya.levi@example.com" aria-describedby="email-hint">
<div class="hint" id="email-hint">For example, name@example.com. We only use it to send the newsletter.</div>
</div>
<div class="actions"><a class="btn btn-block" href="confirmation.default.mobile.html">Submit</a></div>
</form>
</section>
</div>
</main>
</body></html>

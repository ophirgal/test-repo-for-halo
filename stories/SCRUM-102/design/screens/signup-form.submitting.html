<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Your details — Newsletter — Hello World</title><link rel="stylesheet" href="tokens.css"></head>
<body class="desktop">
<nav class="review-bar" aria-label="Design review"><a href="index.html">← Design gallery</a><span>Signup form · loading — submitting · desktop</span></nav>
<main class="page">
<ol class="steps" aria-label="Progress"><li class="done">1. Welcome</li><li class="current" aria-current="step">2. Your details</li><li>3. Done</li></ol>
<div class="card">
<a class="link-back" href="welcome.default.html" aria-disabled="true" tabindex="-1">← Back</a>
<h1>Subscribe to the newsletter</h1>
<form action="confirmation.default.html" method="get" novalidate aria-busy="true">
<div class="field">
<label for="name">Name</label>
<input class="input" id="name" name="name" type="text" autocomplete="name" maxlength="80" required value="Maya Levi" aria-describedby="name-hint" readonly>
<div class="hint" id="name-hint">Up to 80 characters.</div>
</div>
<div class="field">
<label for="email">Email address</label>
<input class="input" id="email" name="email" type="email" autocomplete="email" inputmode="email" required value="maya.levi@example.com" aria-describedby="email-hint" readonly>
<div class="hint" id="email-hint">For example, name@example.com. We only use it to send the newsletter.</div>
</div>
<div class="actions"><button class="btn btn-block" type="submit" disabled aria-busy="true"><svg class="spinner" width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="8" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="3"/><path d="M10 2a8 8 0 0 1 8 8" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/></svg><span>Subscribing…</span></button>
<p class="visually-hidden" role="status">Sending your signup.</p></div>
</form>
</div>
</main>
</body></html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Site page — footer link</title>
<style>
  /* Today's page (docs/index.html), unchanged: */
  html, body { margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; }
  main { padding: 1rem; }
  h1 { overflow-wrap: anywhere; }
  /* Added by SCRUM-102: the site footer with the newsletter link (content centred, as approved in the prototype). */
  body { min-height: 100vh; display: flex; flex-direction: column; background: #fff; color: #1b1f27; }
  main { flex: 1; text-align: center; }
  .site-footer { border-top: 1px solid #d5d9e0; padding: 1rem; font-size: .875rem; color: #5a6270; display: flex; flex-wrap: wrap; gap: .5rem 1.5rem; align-items: center; justify-content: center; }
  .site-footer a { color: #2b4fd8; font-weight: 600; display: inline-flex; align-items: center; min-height: 48px; padding: 0 .25rem; }
  .site-footer a:focus-visible { outline: 3px solid #1f3cae; outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <h1>Hello World</h1>
</main>
<footer class="site-footer" aria-label="Site footer">
  <a href="welcome.default.html">Newsletter</a>
</footer>
</body>
</html>

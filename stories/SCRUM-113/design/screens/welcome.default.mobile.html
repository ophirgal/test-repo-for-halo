<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Welcome</title>
<link rel="stylesheet" href="tokens.css">
<style>.hero{width:100%;max-width:340px;margin:var(--sp-6) auto var(--sp-4);display:block}.rules{opacity:.85;font-size:var(--fs-md);line-height:1.5;margin:0 0 var(--sp-6)}.desk .rules{font-size:19px}</style>
</head>
<body class="mob">
<main class="phone">
  <div class="grow"></div>
  <h1 class="title">SNAKE</h1>
  <p class="tag">Made for the long road</p>
  <svg class="hero" viewBox="0 0 240 160" role="img" aria-label="A glowing neon snake curling around a pink berry">
  <defs>
    <linearGradient id="hs" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#a3ff12"/></linearGradient>
    <filter id="hg" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <path d="M30 130C30 80 90 80 90 110S150 140 150 95 110 40 160 40h20" fill="none" stroke="url(#hs)" stroke-width="18" stroke-linecap="round" filter="url(#hg)"/>
  <path d="M30 130C30 80 90 80 90 110S150 140 150 95 110 40 160 40h12" fill="none" stroke="#0b0f1a" stroke-opacity=".35" stroke-width="5" stroke-dasharray="4 10" stroke-linecap="round"/>
  <ellipse cx="186" cy="40" rx="14" ry="12" fill="#a3ff12" filter="url(#hg)"/>
  <circle cx="191" cy="34" r="3.6" fill="#fff"/><circle cx="192.5" cy="34" r="1.8" fill="#0b0f1a"/>
  <circle cx="191" cy="46" r="3.6" fill="#fff"/><circle cx="192.5" cy="46" r="1.8" fill="#0b0f1a"/>
  <path d="M200 40h8l3-3M208 40l3 3" stroke="#ff3d81" stroke-width="1.6" fill="none" stroke-linecap="round"/>
  <g class="food" filter="url(#hg)"><circle cx="222" cy="78" r="8" fill="#ff3d81"/></g>
</svg>
  <p class="rules">Swipe to steer. Eat berries to grow.<br>Don’t hit the walls or your own tail.</p>
  <div class="grow"></div>
  <p><a class="btn btn-primary" href="game.default.mobile.html"><svg width="22" height="22" viewBox="0 0 20 20" aria-hidden="true"><path d="M6 3.5v13l11-6.5z" fill="currentColor"/></svg> Play</a></p>
  <div class="grow"></div>
</main>
</body>
</html>

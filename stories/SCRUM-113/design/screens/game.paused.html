<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Game — paused</title>
<link rel="stylesheet" href="tokens.css">
<style>
.under{filter:blur(2px) brightness(.45)}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(11,15,26,.55)}
.ptitle{font-size:var(--fs-xl);font-weight:900;letter-spacing:.12em;margin:0;color:var(--accent-2);text-shadow:0 0 14px rgba(34,211,238,.6)}
.pscore{color:var(--muted);margin:var(--sp-2) 0 var(--sp-6)}
.resume{width:96px;height:96px;border-radius:50%;background:var(--accent);color:var(--accent-fg);display:flex;align-items:center;justify-content:center;box-shadow:0 0 32px rgba(163,255,18,.55)}
.resume svg{width:40px;height:40px}
.rlabel{font-weight:800;margin:var(--sp-3) 0 var(--sp-6)}
.desk .ptitle{font-size:44px}.desk .resume{width:112px;height:112px}
</style>
</head>
<body class="desk">
<main class="phone">
  <div class="grow"></div>
  <div class="under" aria-hidden="true"><div class="hud">
    <div class="score" aria-live="polite"><small>SCORE</small>14</div>
    <a class="icon-btn"  aria-label="Pause"><svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><rect x="4" y="3" width="4" height="14" rx="1.5" fill="currentColor"/><rect x="12" y="3" width="4" height="14" rx="1.5" fill="currentColor"/></svg></a>
  </div>
  <a class="field"  aria-label="Play field. Swipe to steer the snake."><svg class="field-svg" viewBox="0 0 16 16" role="img" aria-label="Play field: a glowing green snake heading right toward a pink berry">
  <defs>
    <pattern id="pg" width="1" height="1" patternUnits="userSpaceOnUse"><path d="M1 0H0V1" fill="none" stroke="#1c2740" stroke-width=".04"/></pattern>
    <linearGradient id="ps" gradientUnits="userSpaceOnUse" x1="2.5" y1="13.5" x2="10.5" y2="7.5"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#a3ff12"/></linearGradient>
    <filter id="pglow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation=".22" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="16" height="16" fill="#0e1424"/>
  <rect width="16" height="16" fill="url(#pg)"/>
  <path d="M2.5 13.5V10.5H6.5V7.5H10.4" fill="none" stroke="url(#ps)" stroke-width=".82" stroke-linecap="round" stroke-linejoin="round" filter="url(#pglow)"/>
  <path d="M2.5 13.3V10.5H6.5V7.5H10" fill="none" stroke="#0b0f1a" stroke-opacity=".35" stroke-width=".22" stroke-dasharray=".18 .42" stroke-linecap="round"/>
  <ellipse cx="10.6" cy="7.5" rx=".58" ry=".5" fill="#a3ff12" filter="url(#pglow)"/>
  <circle cx="10.82" cy="7.24" r=".15" fill="#fff"/><circle cx="10.88" cy="7.24" r=".075" fill="#0b0f1a"/>
  <circle cx="10.82" cy="7.76" r=".15" fill="#fff"/><circle cx="10.88" cy="7.76" r=".075" fill="#0b0f1a"/>
  <path d="M11.15 7.5h.32l.13-.12M11.47 7.5l.13.12" fill="none" stroke="#ff3d81" stroke-width=".06" stroke-linecap="round"/>
  <g class="food" filter="url(#pglow)"><circle cx="13.5" cy="7.5" r=".36" fill="#ff3d81"/><path d="M13.5 7.14q.1-.25.3-.3" fill="none" stroke="#a3ff12" stroke-width=".07"/></g>
</svg></a>
  <p class="hint"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h16M16 8l4 4-4 4M8 8l-4 4 4 4"/></svg> Swipe anywhere to steer</p></div>
  <div class="grow"></div>
  <section class="overlay" role="dialog" aria-modal="true" aria-labelledby="pt">
    <h1 class="ptitle" id="pt">Paused</h1>
    <p class="pscore">Score 14</p>
    <a class="resume" href="game.default.html" aria-label="Resume"><svg width="22" height="22" viewBox="0 0 20 20" aria-hidden="true"><path d="M6 3.5v13l11-6.5z" fill="currentColor"/></svg></a>
    <p class="rlabel">Resume</p>
    <a class="btn btn-ghost" href="welcome.default.html">Quit to start</a>
  </section>
</main>
</body>
</html>

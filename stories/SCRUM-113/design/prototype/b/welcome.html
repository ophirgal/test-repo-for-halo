<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Welcome</title>
<link rel="stylesheet" href="tokens.css">
<style>.how ol{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.how li{display:flex;gap:12px;align-items:center;color:var(--text)}
.how li svg{color:var(--muted);flex:none}</style>
</head>
<body>
<main class="screen">
  <header class="appbar"><span class="name"><span class="dot"></span>Road Snake</span></header>
  <section class="card center" style="padding:22px 16px 10px">
    <svg class="hero" viewBox="0 0 300 220" width="260" role="img" aria-label="A snake curling across the screen">
<defs><linearGradient id="hb" x1="0" y1="1" x2="1" y2="0"><stop offset="0" style="stop-color:var(--snake2)"/><stop offset="1" style="stop-color:var(--snake1)"/></linearGradient></defs>
<path d="M30,190 C30,120 140,170 140,110 C140,50 40,80 60,40 C80,5 190,20 230,60" fill="none" stroke="var(--snake-edge)" stroke-width="31" stroke-linecap="round"/>
<path d="M30,190 C30,120 140,170 140,110 C140,50 40,80 60,40 C80,5 190,20 230,60" fill="none" stroke="url(#hb)" stroke-width="27" stroke-linecap="round"/>
<path d="M30,190 C30,120 140,170 140,110 C140,50 40,80 60,40 C80,5 190,20 230,60" fill="none" stroke="var(--scale)" stroke-opacity=".55" stroke-width="9" stroke-dasharray="3 14" stroke-linecap="round"/>
<path class="tongue" d="M252,80 L262,90 M262,90 l2,8 M262,90 l8,2" stroke="var(--food)" stroke-width="3" stroke-linecap="round" fill="none"/>
<circle cx="236" cy="66" r="19" fill="var(--snake1)" stroke="var(--snake-edge)" stroke-width="2"/>
<circle cx="232" cy="58" r="5.5" fill="var(--eye)"/><circle cx="233.5" cy="59.5" r="2.8" fill="var(--eye-pupil)"/>
<circle cx="245" cy="68" r="5.5" fill="var(--eye)"/><circle cx="246.5" cy="69.5" r="2.8" fill="var(--eye-pupil)"/>
<circle class="food-glow" cx="270" cy="150" r="16" fill="var(--food)" opacity=".25"/><circle cx="270" cy="151" r="10" fill="var(--food)"/>
<path d="M270,142 q5,-8 11,-5 q-4,7 -11,5z" fill="var(--leaf)"/></svg>
    <h1 style="font-size:34px;margin-top:6px">Road Snake</h1>
    <p class="muted" style="margin:6px 0 4px">A quick game for the long road.</p>
  </section>
  <section class="card how">
    <h2 style="font-size:15px;margin-bottom:10px">How to play</h2>
    <ol>
      <li><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18M3 12h18M12 3l-3 3M12 3l3 3M12 21l-3-3M12 21l3-3M3 12l3-3M3 12l3 3M21 12l-3-3M21 12l-3 3"/></svg><span><b>Swipe</b> to steer</span></li>
      <li><svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><circle cx="11" cy="12" r="7" fill="var(--food)"/></svg><span><b>Eat</b> to grow and score</span></li>
      <li><svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><rect x="3" y="3" width="16" height="16" rx="3" fill="none" stroke="currentColor" stroke-width="2"/></svg><span><b>Avoid</b> the walls and your tail</span></li>
    </ol>
  </section>
  <div class="spacer"></div>
  <div class="bottombar"><a class="btn" href="game-playing.html">Play</a></div>
</main>
</body>
</html>

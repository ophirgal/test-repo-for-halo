<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Welcome</title>
<link rel="stylesheet" href="tokens.css">
<style>
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font);-webkit-font-smoothing:antialiased}
.phone{max-width:430px;min-height:100vh;margin:0 auto;display:flex;flex-direction:column;position:relative;text-align:center}
a{color:inherit}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
.food{transform-box:fill-box;transform-origin:center;animation:pulse 1.2s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.food{animation:none}}

.phone{padding:var(--sp-4)}
.bar{display:flex;align-items:center;justify-content:center;min-height:48px;font-weight:700;font-size:var(--fs-md)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:var(--sp-4);box-shadow:0 6px 20px rgba(80,50,20,.08)}
.dock{margin-top:auto;padding-top:var(--sp-5);display:flex;flex-direction:column;gap:var(--sp-3)}
.btn{display:flex;align-items:center;justify-content:center;gap:var(--sp-2);min-height:60px;border-radius:16px;font-weight:700;font-size:var(--fs-md);text-decoration:none;width:100%}
.btn-primary{background:var(--accent);color:var(--accent-fg)}
.btn-secondary{background:var(--surface);color:var(--fg);border:1.5px solid var(--line)}
.field{display:block;border-radius:12px;overflow:hidden;border:3px solid #8a6a46}
.field-svg{display:block;width:100%;height:auto}
.chips{display:flex;justify-content:space-between;align-items:center;margin-bottom:var(--sp-3)}
.chip{background:var(--surface-2);border-radius:var(--radius-pill);padding:var(--sp-2) var(--sp-4);font-weight:700;font-size:var(--fs-sm)}
.chip b{color:var(--accent);font-size:var(--fs-md)}
.hint{color:var(--muted);font-size:var(--fs-sm);display:flex;align-items:center;justify-content:center;gap:var(--sp-2);margin:var(--sp-3) 0 0}
.proto{color:var(--muted);opacity:.75;font-size:var(--fs-xs);margin:var(--sp-2) 0 0}

.hero-card{margin-top:var(--sp-3)}
.hero{display:block;width:100%}
.title{font-size:var(--fs-xl);margin:var(--sp-5) 0 var(--sp-1)}
.tag{color:var(--muted);margin:0 0 var(--sp-5)}
.rules{list-style:none;padding:0;margin:0 auto;display:inline-flex;flex-direction:column;gap:var(--sp-3);text-align:left}
.rules li{display:flex;align-items:center;gap:var(--sp-3);font-size:var(--fs-md)}
.rules span{width:36px;height:36px;border-radius:50%;background:var(--surface-2);display:inline-flex;align-items:center;justify-content:center;color:var(--accent)}
</style>
</head>
<body>
<main class="phone">
  <div class="bar">Snake</div>
  <section class="card hero-card">
    <svg class="hero" viewBox="0 0 240 150" role="img" aria-label="An orange striped snake winding toward a red berry">
  <rect x="21" y="111" width="18" height="18" rx="6" fill="#fb923c"/><circle cx="30" cy="120" r="3" fill="#fde68a"/><rect x="21" y="91" width="18" height="18" rx="6" fill="#f97316"/><circle cx="30" cy="100" r="3" fill="#fde68a"/><rect x="21" y="71" width="18" height="18" rx="6" fill="#fb923c"/><circle cx="30" cy="80" r="3" fill="#fde68a"/><rect x="41" y="71" width="18" height="18" rx="6" fill="#f97316"/><circle cx="50" cy="80" r="3" fill="#fde68a"/><rect x="61" y="71" width="18" height="18" rx="6" fill="#fb923c"/><circle cx="70" cy="80" r="3" fill="#fde68a"/><rect x="81" y="71" width="18" height="18" rx="6" fill="#f97316"/><circle cx="90" cy="80" r="3" fill="#fde68a"/><rect x="101" y="71" width="18" height="18" rx="6" fill="#fb923c"/><circle cx="110" cy="80" r="3" fill="#fde68a"/><rect x="101" y="91" width="18" height="18" rx="6" fill="#f97316"/><circle cx="110" cy="100" r="3" fill="#fde68a"/><rect x="101" y="111" width="18" height="18" rx="6" fill="#fb923c"/><circle cx="110" cy="120" r="3" fill="#fde68a"/><rect x="121" y="111" width="18" height="18" rx="6" fill="#f97316"/><circle cx="130" cy="120" r="3" fill="#fde68a"/><rect x="141" y="111" width="18" height="18" rx="6" fill="#fb923c"/><circle cx="150" cy="120" r="3" fill="#fde68a"/><rect x="161" y="111" width="18" height="18" rx="6" fill="#f97316"/><circle cx="170" cy="120" r="3" fill="#fde68a"/><rect x="161" y="91" width="18" height="18" rx="6" fill="#fb923c"/><circle cx="170" cy="100" r="3" fill="#fde68a"/><rect x="161" y="71" width="18" height="18" rx="6" fill="#f97316"/><circle cx="170" cy="80" r="3" fill="#fde68a"/><rect x="161" y="51" width="18" height="18" rx="6" fill="#fb923c"/><circle cx="170" cy="60" r="3" fill="#fde68a"/><rect x="181" y="51" width="18" height="18" rx="6" fill="#f97316"/><circle cx="190" cy="60" r="3" fill="#fde68a"/>
  <rect x="200" y="50" width="22" height="20" rx="8" fill="#ea580c"/>
  <circle cx="214" cy="56" r="3.6" fill="#fff"/><circle cx="215.5" cy="56" r="1.7" fill="#2b2118"/>
  <circle cx="214" cy="64" r="3.6" fill="#fff"/><circle cx="215.5" cy="64" r="1.7" fill="#2b2118"/>
  <g class="food"><circle cx="210" cy="20" r="8" fill="#dc2626"/><path d="M210 12q1-5 6-6q-1 5-6 6z" fill="#16a34a"/></g>
</svg>
  </section>
  <h1 class="title">Snake</h1>
  <p class="tag">A quick game for the passenger seat</p>
  <ol class="rules">
    <li><span><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h16M16 8l4 4-4 4M8 8l-4 4 4 4"/></svg></span>Swipe to steer</li>
    <li><span>🍓</span>Eat berries to grow</li>
    <li><span>✋</span>Don’t hit the walls or your tail</li>
  </ol>
  <div class="dock">
    <a class="btn btn-primary" href="game.html"><svg width="22" height="22" viewBox="0 0 20 20" aria-hidden="true"><path d="M6 3.5v13l11-6.5z" fill="currentColor"/></svg> Play</a>
  </div>
</main>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Welcome</title>
<link rel="stylesheet" href="tokens.css">
<style>.title{margin:8px 0 0;font-size:76px;line-height:.88;font-weight:900;text-transform:uppercase;letter-spacing:.02em;text-align:center;
background:linear-gradient(90deg,var(--snake2),var(--snake1));-webkit-background-clip:text;background-clip:text;color:transparent}
.art{flex:1;display:grid;place-items:center;width:100%}
.hint{display:flex;gap:10px;align-items:center;color:var(--muted);font-size:15px;margin:0 0 18px}</style>
</head>
<body>
<main class="screen">
  <p class="label" style="margin:24px 0 0">A game for the long road</p>
  <h1 class="title">Road<br>Snake</h1>
  <div class="art"><svg class="hero" viewBox="0 0 300 220" width="300" role="img" aria-label="A snake curling across the screen">
<defs><linearGradient id="ha" x1="0" y1="1" x2="1" y2="0"><stop offset="0" style="stop-color:var(--snake2)"/><stop offset="1" style="stop-color:var(--snake1)"/></linearGradient></defs>
<path d="M30,190 C30,120 140,170 140,110 C140,50 40,80 60,40 C80,5 190,20 230,60" fill="none" stroke="var(--snake-edge)" stroke-width="31" stroke-linecap="round"/>
<path d="M30,190 C30,120 140,170 140,110 C140,50 40,80 60,40 C80,5 190,20 230,60" fill="none" stroke="url(#ha)" stroke-width="27" stroke-linecap="round"/>
<path d="M30,190 C30,120 140,170 140,110 C140,50 40,80 60,40 C80,5 190,20 230,60" fill="none" stroke="var(--scale)" stroke-opacity=".55" stroke-width="9" stroke-dasharray="3 14" stroke-linecap="round"/>
<path class="tongue" d="M252,80 L262,90 M262,90 l2,8 M262,90 l8,2" stroke="var(--food)" stroke-width="3" stroke-linecap="round" fill="none"/>
<circle cx="236" cy="66" r="19" fill="var(--snake1)" stroke="var(--snake-edge)" stroke-width="2"/>
<circle cx="232" cy="58" r="5.5" fill="var(--eye)"/><circle cx="233.5" cy="59.5" r="2.8" fill="var(--eye-pupil)"/>
<circle cx="245" cy="68" r="5.5" fill="var(--eye)"/><circle cx="246.5" cy="69.5" r="2.8" fill="var(--eye-pupil)"/>
<circle class="food-glow" cx="270" cy="150" r="16" fill="var(--food)" opacity=".25"/><circle cx="270" cy="151" r="10" fill="var(--food)"/>
<path d="M270,142 q5,-8 11,-5 q-4,7 -11,5z" fill="var(--leaf)"/></svg></div>
  <p class="hint"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18M3 12h18M12 3l-3 3M12 3l3 3M12 21l-3-3M12 21l3-3M3 12l3-3M3 12l3 3M21 12l-3-3M21 12l-3 3"/></svg><span>Swipe anywhere to steer</span></p>
  <div class="actions"><a class="btn" href="game-playing.html">Play</a></div>
</main>
</body>
</html>

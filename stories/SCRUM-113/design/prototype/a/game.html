<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Game</title>
<link rel="stylesheet" href="tokens.css">
<style>
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font);-webkit-font-smoothing:antialiased}
.phone{max-width:430px;min-height:100vh;margin:0 auto;display:flex;flex-direction:column;position:relative;text-align:center}
a{color:inherit}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
.food{transform-box:fill-box;transform-origin:center;animation:pulse 1.2s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.food{animation:none}}

.phone{padding:var(--sp-5) var(--sp-4)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--sp-2);min-height:56px;padding:0 var(--sp-6);border-radius:var(--radius-pill);font-weight:800;font-size:var(--fs-md);text-decoration:none;letter-spacing:.02em}
.btn-primary{background:var(--accent);color:var(--accent-fg);box-shadow:0 0 24px rgba(163,255,18,.45)}
.btn-ghost{color:var(--muted);min-height:48px}
.title{font-size:var(--fs-xxl);font-weight:900;letter-spacing:.08em;margin:0;color:var(--accent);text-shadow:0 0 18px rgba(163,255,18,.6)}
.tag{color:var(--muted);font-size:var(--fs-md);margin:var(--sp-2) 0 0}
.hud{display:flex;align-items:center;justify-content:space-between;padding:0 var(--sp-1) var(--sp-3)}
.score{font-size:var(--fs-xl);font-weight:900;color:var(--accent);text-shadow:0 0 12px rgba(163,255,18,.5);text-align:left;line-height:1}
.score small{display:block;font-size:var(--fs-xs);letter-spacing:.14em;color:var(--muted);font-weight:700;text-shadow:none}
.icon-btn{width:48px;height:48px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:var(--surface-2);color:var(--fg);border:1px solid var(--line);text-decoration:none}
.field{display:block;border-radius:14px;overflow:hidden;box-shadow:0 0 0 2px var(--accent-2),0 0 28px rgba(34,211,238,.35)}
.field-svg{display:block;width:100%;height:auto}
.hint{color:var(--muted);font-size:var(--fs-sm);display:flex;align-items:center;justify-content:center;gap:var(--sp-2);margin-top:var(--sp-4)}
.proto{color:var(--muted);opacity:.7;font-size:var(--fs-xs);margin-top:var(--sp-2)}
.grow{flex:1}
</style>
</head>
<body>
<main class="phone">
  <div class="grow"></div>
  <div class="hud">
    <div class="score"><small>SCORE</small>14</div>
    <a class="icon-btn" href="game-paused.html" aria-label="Pause"><svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><rect x="4" y="3" width="4" height="14" rx="1.5" fill="currentColor"/><rect x="12" y="3" width="4" height="14" rx="1.5" fill="currentColor"/></svg></a>
  </div>
  <a class="field" href="game-over.html" aria-label="Snake crashes (prototype)"><svg class="field-svg" viewBox="0 0 16 16" role="img" aria-label="Play field: a glowing green snake heading right toward a pink berry">
  <defs>
    <pattern id="gg" width="1" height="1" patternUnits="userSpaceOnUse"><path d="M1 0H0V1" fill="none" stroke="#1c2740" stroke-width=".04"/></pattern>
    <linearGradient id="gs" gradientUnits="userSpaceOnUse" x1="2.5" y1="13.5" x2="10.5" y2="7.5"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#a3ff12"/></linearGradient>
    <filter id="gglow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation=".22" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="16" height="16" fill="#0e1424"/>
  <rect width="16" height="16" fill="url(#gg)"/>
  <path d="M2.5 13.5V10.5H6.5V7.5H10.4" fill="none" stroke="url(#gs)" stroke-width=".82" stroke-linecap="round" stroke-linejoin="round" filter="url(#gglow)"/>
  <path d="M2.5 13.3V10.5H6.5V7.5H10" fill="none" stroke="#0b0f1a" stroke-opacity=".35" stroke-width=".22" stroke-dasharray=".18 .42" stroke-linecap="round"/>
  <ellipse cx="10.6" cy="7.5" rx=".58" ry=".5" fill="#a3ff12" filter="url(#gglow)"/>
  <circle cx="10.82" cy="7.24" r=".15" fill="#fff"/><circle cx="10.88" cy="7.24" r=".075" fill="#0b0f1a"/>
  <circle cx="10.82" cy="7.76" r=".15" fill="#fff"/><circle cx="10.88" cy="7.76" r=".075" fill="#0b0f1a"/>
  <path d="M11.15 7.5h.32l.13-.12M11.47 7.5l.13.12" fill="none" stroke="#ff3d81" stroke-width=".06" stroke-linecap="round"/>
  <g class="food" filter="url(#gglow)"><circle cx="13.5" cy="7.5" r=".36" fill="#ff3d81"/><path d="M13.5 7.14q.1-.25.3-.3" fill="none" stroke="#a3ff12" stroke-width=".07"/></g>
</svg></a>
  <p class="hint"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h16M16 8l4 4-4 4M8 8l-4 4 4 4"/></svg> Swipe anywhere to steer</p>
  <p class="proto">Prototype: tap the field to see the snake crash</p>
  <div class="grow"></div>
</main>
</body>
</html>
